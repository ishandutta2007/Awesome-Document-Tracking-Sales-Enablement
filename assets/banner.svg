<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" opacity="0.8" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.2) translate(25px, -15px); opacity: 0.5; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    @keyframes beamSweep {
      0% { transform: translateX(-100%); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateX(100%); opacity: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 300px; }
    .pill-float-1 { animation: floatPill1 6s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill2 7s ease-in-out infinite; }
    .data-line { stroke-dasharray: 8 8; animation: dashCycle 2.5s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Ambient Lights (strictly in background) -->
  <g opacity="0.6">
    <circle class="orb-1" cx="220" cy="120" r="180" fill="#38bdf8" filter="url(#glow)" opacity="0.35" />
    <circle class="orb-2" cx="980" cy="280" r="220" fill="#a855f7" filter="url(#glow)" opacity="0.3" />
    <circle cx="600" cy="210" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.15" />
  </g>

  <!-- Decorative Background Flowlines (behind text) -->
  <g opacity="0.4">
    <path class="data-line" d="M 50 100 C 300 40, 450 160, 600 90 C 750 20, 950 140, 1150 70" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-line" d="M 50 340 C 250 270, 500 380, 700 310 C 900 240, 1050 350, 1150 320" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Background Visual Tech Elements -->
  <!-- Left Decorative Floating Card (Lower Layer) -->
  <g class="pill-float-1" transform="translate(60, 240)" opacity="0.85">
    <rect width="180" height="70" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#badgeShadow)" />
    <circle cx="30" cy="35" r="12" fill="#0ea5e9" opacity="0.2" />
    <text x="30" y="40" text-anchor="middle" font-size="14" fill="#38bdf8">📊</text>
    <text class="badge-text" x="55" y="32" fill="#f8fafc">Page Analytics</text>
    <text class="badge-text" x="55" y="48" fill="#64748b" font-size="11">Time per slide &amp; drop-off</text>
  </g>

  <!-- Right Decorative Floating Card (Lower Layer) -->
  <g class="pill-float-2" transform="translate(960, 110)" opacity="0.85">
    <rect width="180" height="70" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#badgeShadow)" />
    <circle cx="30" cy="35" r="12" fill="#a855f7" opacity="0.2" />
    <text x="30" y="40" text-anchor="middle" font-size="14" fill="#c084fc">🔒</text>
    <text class="badge-text" x="55" y="32" fill="#f8fafc">Virtual Deal Rooms</text>
    <text class="badge-text" x="55" y="48" fill="#64748b" font-size="11">Gated links &amp; audit trails</text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, and Feature Badges (Always crisp & unobstructed) -->
  <g transform="translate(600, 155)">
    <!-- Category Mini-Tag -->
    <rect x="-160" y="-85" width="320" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="badge-text" x="0" y="-66" text-anchor="middle" fill="#38bdf8" letter-spacing="1.5">⚡ CURATED REVENUE STACK 2026</text>

    <!-- Main Title -->
    <text class="title-text" x="0" y="-12" text-anchor="middle" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      Document Tracking <tspan fill="url(#primaryGrad)">&amp; Sales Enablement</tspan>
    </text>

    <!-- Subtitle / Value Proposition -->
    <text class="subtitle-text" x="0" y="32" text-anchor="middle" font-size="18" fill="#94a3b8" letter-spacing="0.2">
      Production-Ready Open-Source Tools &amp; SaaS Platforms for Modern GTM Teams
    </text>

    <!-- Sub-tagline -->
    <text class="subtitle-text" x="0" y="60" text-anchor="middle" font-size="14" fill="#64748b">
      Page-Level Analytics • Deal Rooms • E-Signature • Proposal Automation • Self-Hosted Stacks
    </text>
  </g>

  <!-- Bottom Floating Feature Pills Row (Centered, foreground) -->
  <g transform="translate(600, 320)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <text class="badge-text" x="0" y="5" text-anchor="middle" fill="#e2e8f0">📄 DocSend Alts</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#111827" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <text class="badge-text" x="0" y="5" text-anchor="middle" fill="#e2e8f0">🛡️ Self-Hosted VDR</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#111827" stroke="#a855f7" stroke-width="1.2" opacity="0.95" />
      <text class="badge-text" x="0" y="5" text-anchor="middle" fill="#e2e8f0">✍️ Open e-Signature</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <text class="badge-text" x="0" y="5" text-anchor="middle" fill="#e2e8f0">📈 Buyer Telemetry</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(360, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#111827" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <text class="badge-text" x="0" y="5" text-anchor="middle" fill="#e2e8f0">💼 Enterprise Enablement</text>
    </g>
  </g>

  <!-- Top Accent Border Beam -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#primaryGrad)" />
</svg>
